[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-brain"
version = "0.1.0"
description = "Multi-agent AI controller that schedules a commercial site's solar, battery, flexible loads and generator to cut cost and CO2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data + config
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # solar simulation + forecasting
    "pvlib>=0.10",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    # optimisation
    "pyomo>=6.7",
    "highspy>=1.7",
    # backend
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "reportlab>=4.4",  # deterministic PDF reports; built-in fonts only
    # Explainer LLM client (#19): Groq through its OpenAI-compatible API
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",  # FastAPI TestClient (API tests, #21)
    "pypdf>=5",  # PDF report content checks
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
# Read-only MCP server (python -m energy_brain.mcp_server, docs/mcp.md). Pinned: the version CI tests.
mcp = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
